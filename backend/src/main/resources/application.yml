# backend/src/main/resources/application.yml
spring:
  application:
    name: airetia-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/airetia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # dialect は Hibernate が MySQL JDBC ドライバから自動検出するため指定不要
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

  jackson:
    # フロントエンドの全モデルは camelCase（firstName, startDatetime 等）で定義。
    # バックエンド DTO も Java camelCase フィールドのため変換不要。
    default-property-inclusion: NON_NULL

  session:
    store-type: none
    timeout: 30m

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    check-template-location: false

# ─────────────────────────────────────────────────

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        name: airetia_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAMESITE:lax}
        max-age: 28800

logging:
  level:
    root: INFO
    com.airetia: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_FRAMEWORK:DEBUG}
    org.springframework.web: ${LOG_LEVEL_FRAMEWORK:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_FRAMEWORK:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:TRACE}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

airetia:
  security:
    # カンマ区切りで環境変数 ALLOWED_ORIGINS により上書き（公開環境のURLはここに書かない）
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN:}
  cors:
    max-age: 3600

# AWS S3
# Phase1: ローカル開発時はモック動作（S3Client は空 bucket 設定で起動）
# Phase2/本番: 実際の bucket 名・region を設定する
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:airetia-documents-dev}
  region: ${AWS_REGION:ap-northeast-1}
