<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Palette - New</title>
    <style>
        :root {
            /* ダークモード専用定義 */
            --bg-page: #121212;
            --bg-card: #1e1e1e;
            --bg-main: #2d1b24;    
            --bg-success: #1b2418; 
            --bg-warning: #292516; 
            --bg-error: #2d1a1a;

            --primary: #ff66c4;    
            --secondary: #70bfe1;  
            --accent: #FFC83D;     
            --success: #81c784;
            --warning: #FFE082;    
            --error: #e57373;

            --text-structure: #ffffff;
            --text-main: #d1d1d1;  
            --text-sub: #9e9e9e;
            --info-link: #70bfe1;
            --line-edge: #ff66c4;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        h1 { color: var(--text-structure); border-left: 5px solid var(--primary); padding-left: 15px; }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* セクション背景の適用 */
        .card-main { background-color: var(--bg-main); border-color: var(--line-edge); }
        .card-warning { background-color: var(--bg-warning); }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .tag-primary { background: var(--primary); color: #000; }
        .tag-accent { background: var(--accent); color: #000; }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: opacity 0.2s;
            margin-right: 10px;
        }
        .btn-primary { background-color: var(--primary); color: #000; }
        .btn-secondary { border: 2px solid var(--secondary); color: var(--secondary); }
        
        .code-chip {
            background: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dark Mode Custom Palette</h1>
        <p>ご提示いただいた <span class="code-chip">#ff66c4</span> や <span class="code-chip">#70bfe1</span> をベースにした構成です。</p>

        <div class="preview-grid">
            <div class="card card-main">
                <span class="tag tag-primary">PRIMARY</span>
                <h2 style="color:var(--text-structure); margin:0;">Main Content</h2>
                <p>女性的な華やかさを残したダークトーン背景です。</p>
                <a href="#" class="btn btn-primary">Action</a>
            </div>

            <div class="card">
                <span class="tag tag-accent" style="background:var(--secondary)">SECONDARY</span>
                <h2 style="color:var(--text-structure); margin:0;">Analysis</h2>
                <p>冷静でクリアな印象を与える水色のアクセント。</p>
                <a href="#" class="btn btn-secondary">Outline</a>
            </div>

            <div class="card card-warning">
                <span class="tag tag-accent">WARNING</span>
                <p style="color:var(--warning)"><strong>警告表示:</strong> 黄色系の発色を確認してください。</p>
            </div>

            <div class="card">
                <h2 style="color:var(--text-structure); margin:0;">Links</h2>
                <p>本文のグレー（#d1d1d1）と、<a href="#" style="color:var(--info-link)">リンクの水色</a>のコントラストを確認します。</p>
            </div>
        </div>
    </div>
</body>
</html>
